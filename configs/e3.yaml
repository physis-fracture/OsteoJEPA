# No GPU. Simulation and subsampling only.
defaults: [../base.yaml]
run:
  name: e3
queue_simulation:
  # PLACEHOLDER VALUES. Replace with numbers you can defend, and print this
  # whole block as the assumptions table next to the result.
  arrival_peak_per_hour: 4.0       # 16:00-21:00
  arrival_offpeak_per_hour: 1.5
  n_radiologists: 1
  read_minutes_per_study: 6.0
  flag_budget_frac: 0.10
  sim_days: 60
  orders: [arrival, physis_score]
  output: median_wait_hours_delta
  sensitivity_arrival_pct: [-25, 25]
recalibration_budget:
  n_per_band: [10, 20, 50, 100, 200]
  target_auroc_drop_points: 2.0
  bootstrap_repeats: 20
latency:
  measure: end_to_end
  include: [file_read, preprocess, encode, age_sweep, score]
